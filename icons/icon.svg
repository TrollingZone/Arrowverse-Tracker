<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0f1629"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4fd1ff"/>
      <stop offset="100%" stop-color="#8a5bff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g stroke="url(#stroke)" stroke-width="10" fill="none" filter="url(#glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- stylised bow and arrow forming an 'A' -->
    <path d="M112 380 Q256 80 400 380"/>
    <path d="M256 96 L256 432"/>
    <path d="M216 200 L296 200"/>
    <path d="M196 280 L316 280"/>
    <!-- arrowhead -->
    <path d="M256 96 L232 136 L256 124 L280 136 Z" fill="url(#stroke)" stroke="none"/>
  </g>
  <g fill="#4fd1ff" opacity="0.85">
    <circle cx="112" cy="380" r="10"/>
    <circle cx="400" cy="380" r="10"/>
  </g>
</svg>
